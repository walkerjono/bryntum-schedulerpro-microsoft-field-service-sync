name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: staging
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure Bryntum npm registry
        run: |
          echo "@bryntum:registry=https://npm.bryntum.com" > .npmrc
          echo "//npm.bryntum.com/:_authToken=${{ secrets.BRYNTUM_NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build
        env:
            VITE_MICROSOFT_ENTRA_TENANT_ID: ${{ vars.VITE_MICROSOFT_ENTRA_TENANT_ID }}  
            VITE_MICROSOFT_ENTRA_APP_ID: ${{ vars.VITE_MICROSOFT_ENTRA_APP_ID }}
            VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
            VITE_MICROSOFT_DYNAMICS_ORG_ID: ${{ vars.VITE_MICROSOFT_DYNAMICS_ORG_ID }}
            VITE_CRM_REGION: ${{ vars.VITE_CRM_REGION }}
            VITE_DATAVERSE_API_VERSION: ${{ vars.VITE_DATAVERSE_API_VERSION }}
            VITE_ODATA_MAX_PAGES: ${{ vars.VITE_ODATA_MAX_PAGES }}
            VITE_DEFAULT_VIEW_MODE: ${{ vars.VITE_DEFAULT_VIEW_MODE }}
            VITE_USE_EFFORT_REMAINING: ${{ vars.VITE_USE_EFFORT_REMAINING }}
            VITE_VIEWPORT_BUFFER_DAYS: ${{ vars.VITE_VIEWPORT_BUFFER_DAYS }}
            VITE_HOURS_PER_DAY: ${{ vars.VITE_HOURS_PER_DAY }}
            VITE_EFFORT_REMAINING_OFFSET_DAYS: ${{ vars.VITE_EFFORT_REMAINING_OFFSET_DAYS }}
            VITE_UNDERALLOCATED_THRESHOLD: ${{ vars.VITE_UNDERALLOCATED_THRESHOLD }}
            VITE_OVERALLOCATED_THRESHOLD: ${{ vars.VITE_OVERALLOCATED_THRESHOLD }}

      - name: Include Static Web App config
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Verify built index is deployed
        run: |
          if grep -q 'src/main.ts' dist/index.html; then
            echo "Error: dist/index.html still references src/main.ts (non-built entry)."
            exit 1
          fi
      
      - name: Verify Static Web App config is included
        run: |
          if [ ! -f dist/staticwebapp.config.json ]; then
            echo "Error: dist/staticwebapp.config.json does not exist."
            exit 1
          fi
          if ! grep -q 'navigationFallback' dist/staticwebapp.config.json; then
            echo "Error: dist/staticwebapp.config.json does not include navigationFallback."
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
