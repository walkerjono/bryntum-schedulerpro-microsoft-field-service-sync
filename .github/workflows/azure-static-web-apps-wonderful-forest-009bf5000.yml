name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: staging
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Bryntum npm registry
        run: |
          echo "@bryntum:registry=https://npm.bryntum.com" > .npmrc
          echo "//npm.bryntum.com/:_authToken=${{ secrets.BRYNTUM_NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build
        env:
          VITE_MICROSOFT_ENTRA_APP_ID: ${{ secrets.VITE_MICROSOFT_ENTRA_APP_ID }}
          VITE_MICROSOFT_ENTRA_TENANT_ID: ${{ secrets.VITE_MICROSOFT_ENTRA_TENANT_ID }}
          VITE_MICROSOFT_DYNAMICS_ORG_ID: ${{ secrets.VITE_MICROSOFT_DYNAMICS_ORG_ID }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
          VITE_CRM_REGION: ${{ secrets.VITE_CRM_REGION }}

      - name: Include Static Web App config
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Verify built index is deployed
        run: |
          if grep -q 'src/main.ts' dist/index.html; then
            echo "Error: dist/index.html still references src/main.ts (non-built entry)."
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          skip_app_build: true
