name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: staging
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.BRYNTUM_NPM_USERNAME }}" ]; then
            echo "::error::BRYNTUM_NPM_USERNAME secret is empty or not set"
            exit 1
          fi
          if [ -z "${{ secrets.BRYNTUM_NPM_PASSWORD }}" ]; then
            echo "::error::BRYNTUM_NPM_PASSWORD secret is empty or not set"
            exit 1
          fi
          echo "Both secrets are set"

      - name: Configure Bryntum npm registry
        run: |
          cat << EOF > .npmrc
          @bryntum:registry=https://npm.bryntum.com
          //npm.bryntum.com/:username=${{ secrets.BRYNTUM_NPM_USERNAME }}
          //npm.bryntum.com/:_password=$(echo -n '${{ secrets.BRYNTUM_NPM_PASSWORD }}' | base64 -w 0)
          //npm.bryntum.com/:always-auth=true
          EOF
          echo "--- .npmrc contents ---"
          cat .npmrc

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          action: "close"
