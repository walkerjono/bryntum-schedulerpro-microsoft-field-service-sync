name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Bryntum npm registry
        env:
          BRYNTUM_USER: ${{ secrets.BRYNTUM_NPM_USERNAME }}
          BRYNTUM_PASS: ${{ secrets.BRYNTUM_NPM_PASSWORD }}
        run: |
          echo "@bryntum:registry=https://npm.bryntum.com" >> .npmrc
          echo "//npm.bryntum.com/:username=${BRYNTUM_USER}" >> .npmrc
          echo "//npm.bryntum.com/:_password=$(echo -n "${BRYNTUM_PASS}" | base64)" >> .npmrc
          echo "always-auth=true" >> .npmrc

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FOREST_009BF5000 }}
          action: "close"
